name: "Version Bump & Publish"

on:
  workflow_call:
    inputs:
      version:
        description: "Version bump type (patch, minor, major)"
        type: string
        required: true
      node-version:
        description: "Node.js version"
        type: string
        default: "22"
      package-manager:
        description: "Package manager (npm or yarn)"
        type: string
        default: "npm"
      build-command:
        description: "Build command"
        type: string
        default: "npm run build"
      test-command:
        description: "Test command (empty to skip)"
        type: string
        default: "npm test -- --runInBand"
      publish-branch:
        description: "Branch to commit the version bump to"
        type: string
        default: "main"

jobs:
  bump-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.publish-branch }}
          fetch-depth: 0
          token: ${{ secrets.DEPENDENCY_UPDATE_TOKEN || github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org
          cache: ${{ inputs.package-manager }}

      - name: Enable corepack
        if: inputs.package-manager == 'yarn'
        run: corepack enable

      - name: Install dependencies
        run: |
          if [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          NEW_VERSION=$(npm version ${{ inputs.version }} --no-git-tag-version)
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "## Version bump: $NEW_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: ${{ inputs.build-command }}

      - name: Test
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit, tag, and push
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_UPDATE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump.outputs.version }}"

          git add -A
          git commit -m "chore(release): $VERSION"
          git tag "$VERSION"
          git push origin "${{ inputs.publish-branch }}" --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_UPDATE_TOKEN || github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.version }}" \
            --generate-notes \
            --title "${{ steps.bump.outputs.version }}"

      - name: Summary
        run: |
          echo "Published ${{ steps.bump.outputs.version }} to npm" >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Release: ${{ steps.bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
