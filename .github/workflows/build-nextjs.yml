name: "Build, Test and Lint (Next.js)"

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        type: string
        required: true
      apps:
        description: "Space-separated list of app names to build (e.g. 'front dashboard')"
        type: string
        required: true
      cache-paths:
        description: "Newline-separated paths to cache for node_modules"
        type: string
        default: |
          node_modules
          apps/*/node_modules
          shared/node_modules
      lint-command:
        description: "Lint command"
        type: string
        default: "yarn lint --fix"
      test-command:
        description: "Test command"
        type: string
        default: "yarn test --ci --maxWorkers=2"
      typecheck:
        description: "Run typecheck"
        type: boolean
        default: true
      check-bundle-size:
        description: "Run bundle size check per app"
        type: boolean
        default: false
    secrets:
      SLACK_WEBHOOK:
        required: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ inputs.cache-paths }}
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --prefer-offline

  lint:
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      lint-changed: ${{ steps.lint-check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: ${{ inputs.cache-paths }}
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}

      - run: yarn install --frozen-lockfile --prefer-offline

      - name: Lint with auto-fix
        run: ${{ inputs.lint-command }}

      - name: Check for changes
        id: lint-check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Typecheck
        if: inputs.typecheck
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: ${{ inputs.cache-paths }}
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}

      - run: yarn install --frozen-lockfile --prefer-offline
      - run: ${{ inputs.test-command }}

  build:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        app: ${{ fromJson(format('["{0}"]', join(fromJson(format('["{0}"]', inputs.apps)), '","'))) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: ${{ inputs.cache-paths }}
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}

      - run: yarn install --frozen-lockfile --prefer-offline

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: apps/${{ matrix.app }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ matrix.app }}-${{ hashFiles(format('apps/{0}/**/*', matrix.app), 'shared/**/*') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ matrix.app }}-

      - run: yarn build:${{ matrix.app }}

      - name: Check bundle size
        if: inputs.check-bundle-size
        run: node scripts/check-bundle-size.js ${{ matrix.app }}

  commit-lint-fixes:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: needs.lint.outputs.lint-changed == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: ${{ inputs.cache-paths }}
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}

      - run: yarn install --frozen-lockfile --prefer-offline
      - run: ${{ inputs.lint-command }}

      - name: Commit and push
        run: |
          export HUSKY=0
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No linting changes."
          else
            git commit -m "fix(): linter"
            target="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            [ -n "$target" ] && git push origin "HEAD:$target" || echo "::warning::No branch to push to."
          fi

  notify:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()
    steps:
      - uses: soamee/github-actions/actions/slack-notify@main
        if: always()
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
